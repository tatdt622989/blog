<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

function trackIsland(eventName, details = {}) {
  if (typeof window.gtag === 'function') window.gtag('event', eventName, { app_name: 'island', ...details });
}

/* =====================================================================
 * 整體流程藍圖
 *  1. 地形資料：高度、濕度、溫度 → 生態區（Biome）
 *  2. 規劃地標：村落、遺跡、沉船、碼頭，並整平村落地面、畫出小路
 *  3. 建立場景：地形網格、海水著色器（Shader）、天空與日夜循環
 *  4. 佈置內容：建築（合併成單一網格）、植被（實例化網格 InstancedMesh）
 *  5. 生物：地面動物（漫遊狀態機）、飛鳥、鯊魚、蝴蝶、螢火蟲
 *  6. 互動：環島視角（OrbitControls）／步行探索（PointerLockControls）、小地圖、介面
 * ===================================================================== */

// ---------------------------------------------------------------------
// 0. 參數、亂數與小工具
// ---------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const SEED = parseInt(params.get('seed'), 10) || 20260924;

const SIZE = 1000;             // 地形邊長（公尺）
const SEG = 320;               // 地形切分數
const N = SEG + 1;             // 每邊頂點數
const STEP = SIZE / SEG;       // 格點間距
const EYE = 1.7;               // 步行視線高度
const HOURS_PER_SEC = 24 / 360; // 一天 6 分鐘

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const angleDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const turnTowards = (a, b, maxStep) => a + clamp(angleDiff(a, b), -maxStep, maxStep);

// 柏林雜訊（Perlin Noise）：用種子決定取樣切面，讓每個種子都有不同島形
const perlin = new ImprovedNoise();
const NZ = (SEED % 997) * 0.731 + 0.37;
const noise2 = (x, y) => perlin.noise(x + 11.3, y + 7.7, NZ);
function fbm(x, y, oct = 4) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += a * noise2(x * f, y * f); a *= 0.5; f *= 2.03; }
  return s;
}

// ---------------------------------------------------------------------
// 1. 生態區（Biome）定義
// ---------------------------------------------------------------------
const B = { OCEAN: 0, BEACH: 1, MEADOW: 2, FOREST: 3, JUNGLE: 4, SWAMP: 5, SAVANNA: 6, DESERT: 7, ROCK: 8, SNOW: 9, VOLCANIC: 10 };
const BIOMES = [
  { name: '水域', color: '#c9b27a' },
  { name: '沙灘', color: '#e6d39c' },
  { name: '草原', color: '#86b04e' },
  { name: '溫帶森林', color: '#44783a' },
  { name: '熱帶雨林', color: '#2f7f36' },
  { name: '沼澤', color: '#5a633c' },
  { name: '莽原', color: '#c3b262' },
  { name: '沙漠', color: '#dfc27e' },
  { name: '岩地', color: '#7f776b' },
  { name: '雪地', color: '#eef3f6' },
  { name: '火山地', color: '#3d3533' },
];

// 固定的大地形位置：雪山在西北、火山在東、鏡湖在中南
const MOUNTAIN = { x: -0.17 * SIZE, z: -0.15 * SIZE };
const MOUNTAIN2 = { x: -0.07 * SIZE, z: -0.24 * SIZE };
const VOLCANO = { x: 0.23 * SIZE, z: 0.0 };
const LAKE = { x: -0.02 * SIZE, z: 0.09 * SIZE, r: 0.06 * SIZE };

function rawHeight(x, z) {
  const nx = x / SIZE, nz = z / SIZE;
  // 領域扭曲（Domain Warp）讓海岸線不規則
  const wx = nx + fbm(nx * 2.2 + 3.1, nz * 2.2 - 1.7, 3) * 0.22;
  const wz = nz + fbm(nx * 2.2 - 8.4, nz * 2.2 + 5.2, 3) * 0.22;
  const r = Math.hypot(wx * 1.05, wz * 1.15) / 0.47;
  const coast = 1 - smooth(0.62, 1.0, r);

  let h = -24 + coast * (30 + (fbm(nx * 5, nz * 5, 4) + 0.2) * 14);
  h += coast * fbm(nx * 18, nz * 18, 3) * 3;

  // 雪山主峰與副峰（山脊雜訊讓山形不死板）
  const ridge = 1 - Math.abs(noise2(nx * 7 + 40, nz * 7 + 40));
  const md = Math.hypot(nx - MOUNTAIN.x / SIZE, (nz - MOUNTAIN.z / SIZE) * 1.2);
  h += coast * 112 * Math.exp(-(md * md) / (2 * 0.058 * 0.058)) * (0.55 + 0.6 * ridge);
  const md2 = Math.hypot(nx - MOUNTAIN2.x / SIZE, nz - MOUNTAIN2.z / SIZE);
  h += coast * 70 * Math.exp(-(md2 * md2) / (2 * 0.045 * 0.045)) * (0.6 + 0.5 * ridge);

  // 火山錐與火山口
  const vd = Math.hypot(x - VOLCANO.x, z - VOLCANO.z);
  h += coast * (72 * Math.pow(smooth(125, 0, vd), 1.35) - 26 * smooth(30, 0, vd));

  // 內陸湖
  const ld = Math.hypot(x - LAKE.x, z - LAKE.z);
  h -= 16 * smooth(LAKE.r, LAKE.r * 0.35, ld);
  return h;
}
function moistureAt(x, z) {
  const nx = x / SIZE, nz = z / SIZE;
  return clamp(0.5 + nx * 1.6 + fbm(nx * 4 + 20, nz * 4 - 13, 3) * 0.5, 0, 1);
}
function temperatureAt(x, z, h) {
  const nx = x / SIZE, nz = z / SIZE;
  return clamp(0.5 + nz * 1.5 + fbm(nx * 3 - 7, nz * 3 + 9, 2) * 0.3 - Math.max(0, h) / 110, 0, 1);
}
function classify(h, m, t, slope, x, z) {
  if (h < 0) return B.OCEAN;
  if (Math.hypot(x - VOLCANO.x, z - VOLCANO.z) < 95 && h > 14) return B.VOLCANIC;
  if (h < 2.8) return m > 0.8 ? B.SWAMP : B.BEACH;
  const snowLine = 82 - t * 14;
  if (h > snowLine) return B.SNOW;
  if (h > snowLine - 30 || slope > 1.1) return B.ROCK;
  if (m < 0.3 && t > 0.45) return B.DESERT;
  if (m < 0.42 && t > 0.42) return B.SAVANNA;
  if (m > 0.74 && h < 8) return B.SWAMP;
  if (m > 0.56 && t > 0.5) return B.JUNGLE;
  if (m > 0.56 || (t < 0.3 && m > 0.32)) return B.FOREST;
  return B.MEADOW;
}

// ---------------------------------------------------------------------
// 2. 地形格點資料與查詢
// ---------------------------------------------------------------------
const heights = new Float32Array(N * N);
const moist = new Float32Array(N * N);
const slopes = new Float32Array(N * N);
const biomes = new Uint8Array(N * N);
const pathMask = new Uint8Array(N * N);   // 1 小路、2 廣場、3 農田
const gridX = (ix) => -SIZE / 2 + ix * STEP;

function generateHeights() {
  for (let iz = 0; iz < N; iz++) for (let ix = 0; ix < N; ix++) {
    const x = gridX(ix), z = gridX(iz), i = iz * N + ix;
    heights[i] = rawHeight(x, z);
    moist[i] = moistureAt(x, z);
  }
}
function computeBiomes() {
  for (let iz = 0; iz < N; iz++) for (let ix = 0; ix < N; ix++) {
    const i = iz * N + ix;
    const hx = heights[iz * N + Math.min(ix + 1, SEG)] - heights[iz * N + Math.max(ix - 1, 0)];
    const hz = heights[Math.min(iz + 1, SEG) * N + ix] - heights[Math.max(iz - 1, 0) * N + ix];
    slopes[i] = Math.hypot(hx, hz) / (2 * STEP);
    const x = gridX(ix), z = gridX(iz);
    biomes[i] = classify(heights[i], moist[i], temperatureAt(x, z, heights[i]), slopes[i], x, z);
  }
}
// 與地形網格三角形切法完全一致的高度內插，物件才不會浮空或陷入地面
function getHeight(x, z) {
  const gx = (x + SIZE / 2) / STEP, gz = (z + SIZE / 2) / STEP;
  if (gx < 0 || gz < 0 || gx >= SEG || gz >= SEG) return -24;
  const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  const h00 = heights[iz * N + ix], h10 = heights[iz * N + ix + 1];
  const h01 = heights[(iz + 1) * N + ix], h11 = heights[(iz + 1) * N + ix + 1];
  if (fx + fz <= 1) return h00 + (h10 - h00) * fx + (h01 - h00) * fz;
  return h11 + (h01 - h11) * (1 - fx) + (h10 - h11) * (1 - fz);
}
const cellIndex = (x, z) => {
  const ix = clamp(Math.round((x + SIZE / 2) / STEP), 0, SEG), iz = clamp(Math.round((z + SIZE / 2) / STEP), 0, SEG);
  return iz * N + ix;
};
const getBiome = (x, z) => (getHeight(x, z) < 0 ? B.OCEAN : biomes[cellIndex(x, z)]);

function forCells(cx, cz, R, fn) {
  const x0 = Math.max(0, Math.floor((cx - R + SIZE / 2) / STEP)), x1 = Math.min(SEG, Math.ceil((cx + R + SIZE / 2) / STEP));
  const z0 = Math.max(0, Math.floor((cz - R + SIZE / 2) / STEP)), z1 = Math.min(SEG, Math.ceil((cz + R + SIZE / 2) / STEP));
  for (let iz = z0; iz <= z1; iz++) for (let ix = x0; ix <= x1; ix++) fn(iz * N + ix, gridX(ix), gridX(iz));
}
function flatten(cx, cz, R, target) {
  forCells(cx, cz, R * 1.4, (i, x, z) => {
    const w = smooth(R * 1.4, R * 0.75, Math.hypot(x - cx, z - cz));
    heights[i] = lerp(heights[i], target, w);
  });
}
function stampCircle(cx, cz, R, val) {
  forCells(cx, cz, R, (i, x, z) => {
    if (Math.hypot(x - cx, z - cz) <= R && heights[i] > 0.3) pathMask[i] = Math.max(pathMask[i], val);
  });
}
function stampRect(cx, cz, ry, w, d, val) {
  const c = Math.cos(ry), s = Math.sin(ry);
  forCells(cx, cz, Math.hypot(w, d) / 2 + STEP, (i, x, z) => {
    const dx = x - cx, dz = z - cz;
    if (Math.abs(dx * c - dz * s) < w / 2 && Math.abs(dx * s + dz * c) < d / 2) pathMask[i] = val;
  });
}
// 旋轉 ry 後的局部座標 → 世界座標
function localToWorld(cx, cz, ry, lx, lz) {
  const c = Math.cos(ry), s = Math.sin(ry);
  return { x: cx + lx * c + lz * s, z: cz - lx * s + lz * c };
}

// ---------------------------------------------------------------------
// 3. 地標規劃（村落、遺跡、沉船、碼頭、小路）
// ---------------------------------------------------------------------
function findSite(pred, avoid, { hMin = 3, hMax = 20, waterClear = 50, flatR = 26, tries = 3500 } = {}) {
  let best = null, bestScore = -Infinity;
  for (let k = 0; k < tries; k++) {
    const x = rr(-0.4, 0.4) * SIZE, z = rr(-0.4, 0.4) * SIZE;
    const h = getHeight(x, z);
    if (h < hMin || h > hMax || !pred(getBiome(x, z))) continue;
    if (avoid.some((p) => Math.hypot(p.x - x, p.z - z) < p.r)) continue;
    let dev = 0, same = 0, ok = true;
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2, c = Math.cos(ang), s = Math.sin(ang);
      dev += Math.abs(getHeight(x + c * flatR, z + s * flatR) - h);
      if (getHeight(x + c * waterClear, z + s * waterClear) < 0.8) { ok = false; break; }
      if (pred(getBiome(x + c * flatR, z + s * flatR))) same++;
    }
    if (!ok) continue;
    const score = -dev + same * 1.5 + rand() * 2;
    if (score > bestScore) { bestScore = score; best = { x, z, h }; }
  }
  return best;
}
// 從外海往內陸推進，找到指定角度上的海岸線
function findCoast(angle) {
  const dx = Math.cos(angle), dz = Math.sin(angle);
  for (let d = 490; d > 30; d -= 1.5) {
    if (getHeight(dx * d, dz * d) > 0.6) return { x: dx * d, z: dz * d, dx, dz, d };
  }

}
function makePath(a, b) {
  const L = Math.hypot(b.x - a.x, b.z - a.z), n = Math.max(2, Math.ceil(L / 3));
  const px = -(b.z - a.z) / L, pz = (b.x - a.x) / L;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, off = noise2(t * 3 + a.x * 0.01, 5.5 + b.z * 0.01) * 40 * Math.sin(Math.PI * t);
    pts.push({ x: lerp(a.x, b.x, t) + px * off, z: lerp(a.z, b.z, t) + pz * off });
  }

}

const VILLAGE_DEFS = [
  { key: 'meadow', name: '松風村', style: 'cabin', pred: (b) => b === B.MEADOW },
  { key: 'desert', name: '沙丘聚落', style: 'adobe', pred: (b) => b === B.DESERT || b === B.SAVANNA },
  { key: 'jungle', name: '藤蔓部落', style: 'stilt', pred: (b) => b === B.JUNGLE || b === B.SWAMP },
];

function planWorld() {
  const avoid = [
    { ...MOUNTAIN, r: 135 }, { ...MOUNTAIN2, r: 90 }, { ...VOLCANO, r: 130 }, { x: LAKE.x, z: LAKE.z, r: LAKE.r + 38 },
  ];
  const villages = [];
  for (const def of VILLAGE_DEFS) {
    const site = findSite(def.pred, avoid)
      || findSite(def.pred, avoid, { waterClear: 26, hMin: 2, flatR: 20 })
      || findSite((b) => b !== B.ROCK && b !== B.SNOW && b !== B.VOLCANIC, avoid, { waterClear: 26, hMin: 2 });
    if (!site) continue;
    const v = { ...def, x: site.x, z: site.z, h: Math.max(3, site.h) };
    villages.push(v);
    avoid.push({ x: v.x, z: v.z, r: 175 });
  }
  const ruinsSite = findSite((b) => b === B.JUNGLE || b === B.FOREST, avoid, { hMin: 4, hMax: 35, waterClear: 25, flatR: 16 })
    || findSite((b) => b !== B.BEACH && b !== B.SNOW, avoid, { hMin: 3, hMax: 40, waterClear: 20, flatR: 14 });
  const ruins = ruinsSite ? { x: ruinsSite.x, z: ruinsSite.z, h: ruinsSite.h, ry: rand() * Math.PI * 2 } : null;

  // 整平：村落與遺跡要有平坦地面
  for (const v of villages) flatten(v.x, v.z, 46, v.h);
  if (ruins) flatten(ruins.x, ruins.z, 20, ruins.h);

  // 沉船：西南偏南的海岸
  let wreck = null;
  for (let k = 0; k < 8 && !wreck; k++) {
    const c = findCoast(2.0 + rr(-0.25, 0.25));
    if (c && villages.every((v) => Math.hypot(v.x - c.x, v.z - c.z) > 70)) wreck = c;
  }
  return { villages, ruins, wreck };
}

function planVillage(v) {
  v.fieldAngle = v.style === 'adobe' ? null : rand() * Math.PI * 2;
  v.towerAngle = v.style === 'cabin' ? v.fieldAngle + Math.PI : null;
  const n = v.style === 'adobe' ? 8 : 7 + Math.floor(rand() * 2);
  v.huts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rr(-0.12, 0.12);
    if (v.fieldAngle !== null && Math.abs(angleDiff(a, v.fieldAngle)) < 0.5) continue;
    if (v.towerAngle !== null && Math.abs(angleDiff(a, v.towerAngle)) < 0.6) continue;
    const rad = rr(21, 30);
    v.huts.push({ x: v.x + Math.cos(a) * rad, z: v.z + Math.sin(a) * rad });
  }
  if (v.fieldAngle !== null) {
    const fx = v.x + Math.cos(v.fieldAngle) * 41, fz = v.z + Math.sin(v.fieldAngle) * 41;
    v.field = { x: fx, z: fz, ry: Math.atan2(v.x - fx, v.z - fz), w: 18, d: 11 };
    stampRect(fx, fz, v.field.ry, v.field.w, v.field.d, 3);
  }
  stampCircle(v.x, v.z, 13, 2);
}

// 從村落往外找最近的海岸（排除內陸湖），規劃碼頭
function planDock(v) {
  let best = null;
  for (let k = 0; k < 72; k++) {
    const a = (k / 72) * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
    for (let d = 30; d < 210; d += 2) {
      const x = v.x + dx * d, z = v.z + dz * d;
      if (getHeight(x, z) < 1.2) {
        if (Math.hypot(x - LAKE.x, z - LAKE.z) > LAKE.r + 15 && (!best || d < best.d)) best = { x, z, dx, dz, d };
        break;
      }
    }
  }
  if (!best) return null;
  return { x: best.x - best.dx * 3, z: best.z - best.dz * 3, dx: best.dx, dz: best.dz, village: v };
}

const CELL = 16;
const colliderGrid = new Map();
function addCollider(x, z, r) {
  for (let cx = Math.floor((x - r - 1) / CELL); cx <= Math.floor((x + r + 1) / CELL); cx++)
    for (let cz = Math.floor((z - r - 1) / CELL); cz <= Math.floor((z + r + 1) / CELL); cz++) {
      const key = cx + ',' + cz;
      if (!colliderGrid.has(key)) colliderGrid.set(key, []);
      colliderGrid.get(key).push({ x, z, r });
    }
}
function resolveCollisions(p, rad) {
  const list = colliderGrid.get(Math.floor(p.x / CELL) + ',' + Math.floor(p.z / CELL));
  if (!list) return;
  for (const c of list) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + rad;
    if (d < m && d > 1e-5) { p.x = c.x + (dx / d) * m; p.z = c.z + (dz / d) * m; }
  }
}
function isBlocked(x, z, rad) {
  const list = colliderGrid.get(Math.floor(x / CELL) + ',' + Math.floor(z / CELL));
  return !!list && list.some((c) => Math.hypot(x - c.x, z - c.z) < c.r + rad);
}

function buildTerrain() {
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG).rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(N * N * 3);
  const col = new THREE.Color();
  const bCols = BIOMES.map((b) => new THREE.Color(b.color));
  const seabedShallow = new THREE.Color('#d2bd86'), seabedDeep = new THREE.Color('#4f6b63');
  const maskCols = [null, new THREE.Color('#9b7b52'), new THREE.Color('#a88c62'), new THREE.Color('#6b4a2e')];
  for (let i = 0; i < N * N; i++) {
    const h = heights[i], b = biomes[i];
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, h);
    if (h < 0) col.copy(seabedShallow).lerp(seabedDeep, smooth(0, 18, -h));
    else {
      col.copy(bCols[b]);
      if (b === B.BEACH && h < 0.9) col.multiplyScalar(0.84);      // 潮濕沙
      if (b === B.ROCK) col.offsetHSL(0, 0, Math.sin(h * 0.35) * 0.035); // 岩層紋理
      if (b === B.VOLCANIC && slopes[i] < 0.5 && Math.hypot(x - VOLCANO.x, z - VOLCANO.z) < 26) col.set('#5a2a1a');
    }
    const nv = fbm(x * 0.03, z * 0.03, 2);
    col.offsetHSL(nv * 0.02, 0, nv * 0.07 + (rand() - 0.5) * 0.03);
    if (pathMask[i]) col.lerp(maskCols[pathMask[i]], 0.85);
    colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 }));
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
}

let water;
function buildWater() {
  // 地形高度圖給海水著色器，用來算水深（顏色漸層）與岸邊浪花
  const hdata = new Uint16Array(N * N);
  for (let i = 0; i < N * N; i++) hdata[i] = THREE.DataUtils.toHalfFloat(heights[i]);
  const tex = new THREE.DataTexture(hdata, N, N, THREE.RedFormat, THREE.HalfFloatType);
  tex.magFilter = tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;

  const uniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uTime: { value: 0 }, uSize: { value: SIZE }, uStep: { value: STEP }, uN: { value: N },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunColor: { value: new THREE.Color() },
    uSkyColor: { value: new THREE.Color() }, uLight: { value: 1 },
  }]);
  uniforms.uHeight = { value: tex };

  const mat = new THREE.ShaderMaterial({
    uniforms, fog: true, transparent: true,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      #include <common>
      #include <fog_pars_vertex>
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        vec4 mvPosition = viewMatrix * wp;
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform sampler2D uHeight; uniform float uSize; uniform float uStep; uniform float uN;
      uniform vec3 uSunDir; uniform vec3 uSunColor; uniform vec3 uSkyColor; uniform float uLight;
      varying vec3 vWorld;
      #include <common>
      #include <fog_pars_fragment>
      void main() {
        vec2 p = vWorld.xz;
        // 多組方向波的斜率疊加 → 水面法線
        vec2 g = vec2(0.0);
        g += vec2(0.94, 0.34) * 0.030 * cos(dot(vec2(0.94, 0.34), p) * 0.075 + uTime * 0.9);
        g += vec2(-0.45, 0.89) * 0.026 * cos(dot(vec2(-0.45, 0.89), p) * 0.11 + uTime * 1.2);
        g += vec2(0.2, -0.98) * 0.020 * cos(dot(vec2(0.2, -0.98), p) * 0.19 + uTime * 1.6);
        g += vec2(-0.8, -0.6) * 0.018 * cos(dot(vec2(-0.8, -0.6), p) * 0.37 + uTime * 2.3);
        g += vec2(0.6, 0.8) * 0.014 * cos(dot(vec2(0.6, 0.8), p) * 0.83 + uTime * 3.1);
        vec3 n = normalize(vec3(-g.x, 1.0, -g.y));

        vec2 uv = ((p + uSize * 0.5) / uStep + 0.5) / uN;
        float terrain = -30.0;
        if (uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0) terrain = texture2D(uHeight, uv).r;
        float depth = max(0.0, -terrain);
        float sh = exp(-depth * 0.16);

        vec3 col = mix(vec3(0.015, 0.11, 0.22), vec3(0.10, 0.52, 0.50), sh);
        vec3 V = normalize(cameraPosition - vWorld);
        float fres = 0.04 + 0.96 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
        col *= (0.65 + 0.35 * max(dot(n, uSunDir), 0.0)) * uLight;
        col = mix(col, uSkyColor, fres * 0.7);
        float spec = pow(max(dot(reflect(-V, n), uSunDir), 0.0), 220.0);
        col += uSunColor * spec * 3.0;

        // 岸邊浪花：沿等深線往岸上推的白色條紋
        float ripple = sin(depth * 4.5 - uTime * 2.0 + sin(p.x * 0.09 + uTime * 0.3) * 1.5 + cos(p.y * 0.08) * 1.5);
        float foam = smoothstep(2.6, 0.0, depth) * smoothstep(0.55, 0.95, ripple) + smoothstep(0.45, 0.0, depth) * 0.9;
        foam = clamp(foam, 0.0, 1.0);
        col = mix(col, vec3(0.92, 0.96, 0.97) * max(uLight, 0.25), foam * 0.85);

        gl_FragColor = vec4(col, max(mix(0.97, 0.5, sh), foam * 0.9));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
  });
  water = new THREE.Mesh(new THREE.PlaneGeometry(24000, 24000).rotateX(-Math.PI / 2), mat);
  scene.add(water);
}

class Smoke {
  constructor(x, y, z, { count = 10, rise = 14, size = 2.2, life = 5, color = '#9a9a9a', opacity = 0.35, spread = 0.6 } = {}) {
    Object.assign(this, { x, y, z, rise, size, life, opacity, spread });
    this.sprites = [];
    for (let i = 0; i < count; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color, transparent: true, depthWrite: false, opacity: 0 }));
      s.userData = { age: (life * i) / count, jx: (Math.random() - 0.5) * spread, jz: (Math.random() - 0.5) * spread };
      scene.add(s);
      this.sprites.push(s);
    }
  }
  update(dt, light) {
    for (const s of this.sprites) {
      const u = s.userData;
      u.age += dt;
      if (u.age > this.life) { u.age -= this.life; u.jx = (Math.random() - 0.5) * this.spread; u.jz = (Math.random() - 0.5) * this.spread; }
      const t = u.age / this.life;
      s.position.set(this.x + u.jx * (1 + t * 6) + t * this.rise * 0.4, this.y + t * this.rise, this.z + u.jz * (1 + t * 6));
      s.scale.setScalar(this.size * (0.5 + t * 2));
      s.material.opacity = Math.sin(t * Math.PI) * this.opacity;
      s.material.color.setScalar(0.35 + 0.35 * light);
    }
  }
}

const campfires = [];
function buildCampfire(sb, x, z) {
  const y = getHeight(x, z);
  for (let k = 0; k < 9; k++) {
    const a = (k / 9) * Math.PI * 2;
    sb.add(G.dodec, '#7d7870', mtx(x + Math.cos(a) * 1.1, y + 0.15, z + Math.sin(a) * 1.1, 0.32, 0.25, 0.32, 0, a, 0));
  }
  for (let k = 0; k < 3; k++) sb.add(G.cyl6, '#4a3020', mtx(x, y + 0.25, z, 0.12, 1.6, 0.12, Math.PI / 2 - 0.2, (k / 3) * Math.PI, 0, 'YXZ'));
  // 圍火原木長椅
  for (let k = 0; k < 3; k++) {
    const a = (k / 3) * Math.PI * 2 + 0.5;
    sb.add(G.cyl8, '#6b4a2e', mtx(x + Math.cos(a) * 4.5, y + 0.35, z + Math.sin(a) * 4.5, 0.35, 2.6, 0.35, Math.PI / 2, -a, 0, 'YXZ'));
  }
  const flame = new THREE.Group();
  ['#ff5a1a', '#ff9a2a', '#ffd060'].forEach((c, k) => {
    const m = new THREE.Mesh(G.cone7, new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.9 }));
    m.scale.set(0.7 - k * 0.18, 1.6 - k * 0.35, 0.7 - k * 0.18);
    m.position.y = 0.8 - k * 0.1;
    flame.add(m);
  });
  flame.position.set(x, y, z);
  scene.add(flame);
  const light = new THREE.PointLight('#ff8a3a', 60, 70, 2);
  light.position.set(x, y + 2.5, z);
  scene.add(light);
  campfires.push({ flame, light, smoke: new Smoke(x, y + 2, z, { count: 10, rise: 16, size: 2.4, life: 5, opacity: 0.3 }) });
  addCollider(x, z, 1.6);
}

function buildCabin(parent) {
  const w = rr(5.5, 7), d = rr(4.5, 5.5), H = 3.1;
  sb.add(G.box, '#7c766c', mtx(0, -0.2, 0, w + 0.5, 1.2, d + 0.5), parent);
  sb.add(G.box, pick(['#8b5e3c', '#7a5232', '#94673f']), mtx(0, H / 2 + 0.4, 0, w, H, d), parent);
  for (const [cx, cz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) sb.add(G.cyl6, '#5e3d22', mtx((cx * w) / 2, H / 2 + 0.4, (cz * d) / 2, 0.22, H + 0.2, 0.22), parent);
  const a = (w + 1.2) / 1.732, rb = 1.5;
  sb.add(G.prism, pick(['#8e3b2c', '#6b4a2e', '#a0522d']), mtx(0, H + 0.4 + 0.5 * rb, 0, a, rb, d + 1.2), parent);
  sb.add(G.box, '#3b2716', mtx(0, 1.45, d / 2 + 0.03, 1.1, 2.1, 0.12), parent);

  wb.add(G.box, '#2c3a44', mtx(-w * 0.3, 2.1, d / 2 + 0.04, 0.9, 0.8, 0.1), parent);

}
function buildRoundHut(parent, straw) {
  const r = rr(2.4, 3), H = 2.5;
  sb.add(G.cyl8, '#a07850', mtx(0, H / 2, 0, r, H, r), parent);

function buildStilt(parent) {
  const P = 2.6, s = 3.2;

  sb.add(G.box, '#7a5a3a', mtx(0, P, 0, 2 * s + 0.6, 0.3, 2 * s + 0.6), parent);
  sb.add(G.cyl8, '#9c7a4e', mtx(0, P + 1.35, 0, 2.6, 2.4, 2.6), parent);
  sb.add(G.cone8, '#b89150', mtx(0, P + 2.55 + 1.6, 0, 3.8, 3.6, 3.8), parent);
  sb.add(G.box, '#3b2716', mtx(0, P + 1.1, 2.55, 1, 1.8, 0.3), parent);
  wb.add(G.box, '#2c3a44', mtx(-1.85, P + 1.5, 1.85, 0.5, 0.5, 0.1, 0, -Math.PI / 4, 0), parent);
  // 圍欄
  for (const sx of [-1, 1]) sb.add(G.box, '#6b4a2e', mtx(sx * (s + 0.25), P + 0.55, 0, 0.1, 0.1, 2 * s + 0.5), parent);
  sb.add(G.box, '#6b4a2e', mtx(0, P + 0.55, -(s + 0.25), 2 * s + 0.5, 0.1, 0.1), parent);
  // 梯子
  for (const lx of [-0.45, 0.45]) sb.add(G.box, '#5a4030', mtx(lx, P / 2, s + 1.0, 0.1, P + 0.6, 0.1, 0.38, 0, 0), parent);

  return s + 0.5;
}
function buildTorch(x, z) {

function buildBarrel(x, z) {

function buildCrate(x, z, s = 0.9) {

function fenceLine(x1, z1, x2, z2, color = '#7a5a3a') {
  const L = Math.hypot(x2 - x1, z2 - z1), n = Math.max(1, Math.round(L / 2.2));
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = lerp(x1, x2, t), z = lerp(z1, z2, t), y = getHeight(x, z);
    sb.add(G.box, color, mtx(x, y + 0.5, z, 0.16, 1.3, 0.16));
    if (prev) {
      const seg = Math.hypot(x - prev.x, z - prev.z);
      const ry = Math.atan2(x - prev.x, z - prev.z), rx = -Math.atan2(y - prev.y, seg);
      for (const hh of [0.45, 0.95]) sb.add(G.box, color, mtx((x + prev.x) / 2, (y + prev.y) / 2 + hh, (z + prev.z) / 2, 0.07, 0.1, seg + 0.1, rx, ry, 0, 'YXZ'));
    }
    prev = { x, y, z };
  }
}

  sb.add(G.prism, '#8e3b2c', mtx(x, y + 2.9, z, 1.9 / 1.732 * 1.4, 0.7, 1.8, 0, Math.PI / 2, 0));
  sb.add(G.cyl6, '#7a5230', mtx(x + 0.3, y + 1.6, z, 0.22, 0.35, 0.22));

}

  sb.add(G.box, '#7a5a3a', mtx(0, 7.2, 0, 4.2, 0.3, 4.2), parent);

    sb.add(G.box, '#6b4a2e', mtx(s * 2, 8, 0, 0.1, 0.9, 4.2), parent);

  sb.add(G.cone4, '#8e3b2c', mtx(0, 10.2, 0, 3.4, 1.8, 3.4, 0, Math.PI / 4, 0), parent);

function buildMarketStall(x, z, ry) {

  sb.add(G.box, pick(['#c0392b', '#2e6fb0', '#d4a017', '#7d3c98', '#1f8a70']), mtx(0, 2.45, 0, 3.5, 0.1, 2.5, 0.12, 0, 0), parent);
  sb.add(G.box, '#8b6b43', mtx(0, 0.45, 0.6, 3, 0.9, 0.9), parent);

function buildTotem(x, z) {

    sb.add(G.box, '#f2eee4', mtx(x + 0.25, y + 0.8 + k * 1.15, z + 0.56, 0.22, 0.18, 0.05));

function buildDryingRack(x, z, ry) {
  const y = getHeight(x, z), parent = mtx(x, y, z, 1, 1, 1, 0, ry, 0);
  for (const s of [-1, 1]) for (const t of [-1, 1]) sb.add(G.box, '#5e3d22', mtx(s * 1.6, 1, t * 0.35, 0.1, 2.1, 0.1, t * 0.3, 0, 0), parent);
  sb.add(G.cyl6, '#6b4a2e', mtx(0, 1.9, 0, 0.06, 3.4, 0.06, 0, 0, Math.PI / 2), parent);
  for (let k = 0; k < 5; k++) sb.add(G.box, '#9fb0b8', mtx(-1.2 + k * 0.6, 1.45, 0, 0.18, 0.8, 0.05), parent);

function buildLogPile(x, z, ry) {
  const y = getHeight(x, z), parent = mtx(x, y, z, 1, 1, 1, 0, ry, 0);
  const rows = [[-0.9, 0, 0.3], [0, 0, 0.3], [0.9, 0, 0.3], [-0.45, 0.78, 0.3], [0.45, 0.78, 0.3], [0, 1.56, 0.3]];
  for (const [lx, ly] of rows) sb.add(G.cyl8, '#7a5230', mtx(lx, ly + 0.45, 0, 0.45, 3.2, 0.45, Math.PI / 2, 0, 0), parent);
  addCollider(x, z, 1.8);
}
function buildField(f, crop) {
  const { x, z, ry, w, d } = f;
  const corners = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([lx, lz]) => localToWorld(x, z, ry, lx, lz));
  // 靠村落那側（局部 +z）留一個入口
  fenceLine(corners[0].x, corners[0].z, corners[1].x, corners[1].z);
  fenceLine(corners[1].x, corners[1].z, corners[2].x, corners[2].z);
  fenceLine(corners[3].x, corners[3].z, corners[0].x, corners[0].z);
  const gateL = localToWorld(x, z, ry, -2, d / 2), gateR = localToWorld(x, z, ry, 2, d / 2);
  fenceLine(corners[2].x, corners[2].z, gateR.x, gateR.z);
  fenceLine(gateL.x, gateL.z, corners[3].x, corners[3].z);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 9; c++) {
    const p = localToWorld(x, z, ry, -w / 2 + 1.5 + c * ((w - 3) / 8), -d / 2 + 1.5 + r * ((d - 3) / 4));
    const y = getHeight(p.x, p.z);
    if (crop === 'wheat') for (let k = 0; k < 3; k++) sb.add(G.cone3, '#d9c25a', mtx(p.x + (k - 1) * 0.3, y + 0.55, p.z, 0.12, 1.1, 0.12));
    else if (crop === 'corn') { sb.add(G.cyl5, '#5d8a3a', mtx(p.x, y + 1, p.z, 0.08, 2, 0.08)); sb.add(G.box, '#6fa84a', mtx(p.x, y + 1.1, p.z, 0.9, 0.05, 0.25, 0, rand() * 3, 0.5)); sb.add(G.cyl5, '#e5c14a', mtx(p.x + 0.12, y + 1.4, p.z, 0.08, 0.4, 0.08)); }
    else sb.add(G.ico0, '#6aa84f', mtx(p.x, y + 0.25, p.z, 0.38, 0.3, 0.38));
  }
}

function buildVillage(v) {
  for (const hut of v.huts) {
    const y = getHeight(hut.x, hut.z), ry = Math.atan2(v.x - hut.x, v.z - hut.z);
    const parent = mtx(hut.x, y, hut.z, 1, 1, 1, 0, ry, 0);
    let r;
    if (v.style === 'cabin') r = rand() < 0.6 ? buildCabin(parent) : buildRoundHut(parent, '#c9a45a');
    else if (v.style === 'adobe') r = buildAdobe(parent);
    else r = rand() < 0.65 ? buildStilt(parent) : buildRoundHut(parent, '#a88a4a');
    addCollider(hut.x, hut.z, r);
    // 屋旁雜物
    const side = localToWorld(hut.x, hut.z, ry, r + 1.2, rr(-1, 1));
    if (rand() < 0.5) buildBarrel(side.x, side.z); else buildCrate(side.x, side.z);
  }
  buildCampfire(sb, v.x, v.z);
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2 + 0.3;
    buildTorch(v.x + Math.cos(a) * 14, v.z + Math.sin(a) * 14);
  }
  const dirAt = (a, d) => ({ x: v.x + Math.cos(a) * d, z: v.z + Math.sin(a) * d });
  if (v.style === 'cabin') {
    const w = dirAt(v.fieldAngle + 1.2, 9); buildWell(w.x, w.z);
    const t = dirAt(v.towerAngle, 33); buildWatchtower(t.x, t.z, v.towerAngle);
    const lp = dirAt(v.fieldAngle - 1.1, 10); buildLogPile(lp.x, lp.z, v.fieldAngle);
    buildField(v.field, 'wheat');
  } else if (v.style === 'adobe') {
    for (let k = 0; k < 3; k++) {
      const a = (k / 3) * Math.PI * 2 + 1, p = dirAt(a, 9);
      buildMarketStall(p.x, p.z, Math.atan2(v.x - p.x, v.z - p.z));
    }
    // 聚落外圍種幾棵棕櫚（實例化植被，稍後統一建立）
    for (let k = 0; k < 7; k++) {
      const p = dirAt(rand() * Math.PI * 2, rr(35, 44));
      manualPlants.push({ kind: 'palm', x: p.x, z: p.z });
    }
  } else {
    const t = dirAt(rand() * Math.PI * 2, 8); buildTotem(t.x, t.z);
    const dr = dirAt(v.fieldAngle + Math.PI, 11); buildDryingRack(dr.x, dr.z, v.fieldAngle);
    buildField(v.field, 'corn');
  }
  exclusions.push({ x: v.x, z: v.z, r: 46 });
  if (v.field) exclusions.push({ x: v.field.x, z: v.field.z, r: 12 });
}

function buildDock(dock) {
  const { x, z, dx, dz } = dock, ry = Math.atan2(dx, dz), L = 30, deckY = 1.5;
  for (let i = 0; i < L; i++) sb.add(G.box, i % 2 ? '#8a6a45' : '#7d5e3c', mtx(x + dx * (i + 0.5), deckY, z + dz * (i + 0.5), 3.2, 0.22, 0.92, 0, ry, 0));
  for (let i = 0; i <= L; i += 4) for (const s of [-1, 1]) {
    const px = x + dx * i - dz * s * 1.55, pz = z + dz * i + dx * s * 1.55;
    const top = deckY + 0.6, bottom = Math.min(getHeight(px, pz), deckY) - 1.5;
    sb.add(G.cyl6, '#5a4030', mtx(px, (top + bottom) / 2, pz, 0.2, top - bottom, 0.2));
  }
  const endC = { x: x + dx * (L - 2) + dz * 1, z: z + dz * (L - 2) - dx * 1 };
  sb.add(G.box, '#a0784a', mtx(endC.x, deckY + 0.55, endC.z, 0.9, 0.9, 0.9, 0, ry + 0.3, 0));
  sb.add(G.cyl8, '#7a5230', mtx(endC.x - dz * 1.2, deckY + 0.6, endC.z + dx * 1.2, 0.4, 1, 0.4));
  // 小船（獨立網格，會隨浪起伏）
  const boat = makeBoat();
  boat.position.set(x + dx * (L - 5) - dz * 3.4, 0.1, z + dz * (L - 5) + dx * 3.4);
  boat.rotation.y = ry + 0.15;
  boat.userData.ph = rand() * 6;
  scene.add(boat);
  boats.push(boat);
  exclusions.push({ x, z, r: 8 });
}

function buildShipwreck(c) {
  const { dx, dz } = c, yaw = Math.atan2(dx, dz) + Math.PI / 2 + 0.45;
  const sx = c.x + dx * 7, sz = c.z + dz * 7;
  const parent = mtx(sx, -0.9, sz, 1, 1, 1, 0.06, yaw, 0.32);
  sb.add(G.box, '#5b3a22', mtx(0, 1.5, 0, 5, 3, 15), parent);
  sb.add(G.box, '#4e321d', mtx(0, -0.2, 0, 3.6, 1.2, 13), parent);
  sb.add(G.cone4, '#5b3a22', mtx(0, 1.5, 9.4, 2.5, 3.8, 1.8, Math.PI / 2, 0, 0), parent);
  sb.add(G.box, '#7a5a3a', mtx(0, 3.05, 0, 4.6, 0.2, 14.5), parent);
  for (const s of [-1, 1]) sb.add(G.box, '#4a2e1a', mtx(s * 2.4, 3.5, 0, 0.2, 0.7, 14.5), parent);
  sb.add(G.box, '#4e3220', mtx(0, 4.1, -5.5, 4, 2, 3.5), parent);
  sb.add(G.box, '#3a2616', mtx(0, 5.2, -5.5, 4.4, 0.25, 3.9), parent);
  sb.add(G.box, '#1e140c', mtx(2.52, 1.6, 2.2, 0.12, 1.5, 2.2), parent);  // 船身破洞
  sb.add(G.cyl6, '#4a3020', mtx(0, 6.6, 1, 0.35, 7, 0.35, 0, 0, 0.12), parent);
  sb.add(G.cyl6, '#4a3020', mtx(0.5, 9.2, 1, 0.14, 5, 0.14, 0, 0, Math.PI / 2 + 0.25), parent);
  sb.add(G.box, '#e6dcc3', mtx(0.3, 7.4, 1.15, 3.6, 2.8, 0.06, 0.1, 0, 0.2), parent);
  sb.add(G.box, '#d8ccb0', mtx(-1.3, 6, 1.2, 1.4, 1.6, 0.06, 0.3, 0, -0.4), parent);
  sb.add(G.cyl6, '#4a3020', mtx(0, 4.5, 5.2, 0.28, 3, 0.28, 0.2, 0, 0), parent);  // 前桅斷樁
  // 船員求生營地：帆布帳篷、火堆殘跡與漂上岸的物資
  const tx = c.x - dx * 16, tz = c.z - dz * 16, ty = getHeight(tx, tz), tRy = Math.atan2(dx, dz) + Math.PI / 2;
  sb.add(G.prism, '#d8c9a3', mtx(0, 0.75, 0, 1.75, 1.5, 3.4), mtx(tx, ty, tz, 1, 1, 1, 0, tRy, 0));
  sb.add(G.cyl6, '#5e3d22', mtx(0, 1.3, 1.8, 0.07, 2.6, 0.07), mtx(tx, ty, tz, 1, 1, 1, 0, tRy, 0));
  const fx = tx + dx * 4, fz = tz + dz * 4, fy = getHeight(fx, fz);
  for (let k = 0; k < 8; k++) { const a = (k / 8) * Math.PI * 2; sb.add(G.dodec, '#6f6a62', mtx(fx + Math.cos(a) * 0.9, fy + 0.1, fz + Math.sin(a) * 0.9, 0.25, 0.2, 0.25)); }
  sb.add(G.cyl8, '#2a2522', mtx(fx, fy + 0.05, fz, 0.7, 0.1, 0.7));
  for (let k = 0; k < 9; k++) {
    const p = { x: c.x - dx * rr(2, 14) + dz * rr(-14, 14), z: c.z - dz * rr(2, 14) - dx * rr(-14, 14) };
    if (getHeight(p.x, p.z) < 0.3) continue;
    if (rand() < 0.5) buildBarrel(p.x, p.z); else buildCrate(p.x, p.z, rr(0.7, 1.1));
  }
  const mx = c.x - dx * 5 + dz * 8, mz = c.z - dz * 5 - dx * 8;
  sb.add(G.cyl6, '#4a3020', mtx(mx, getHeight(mx, mz) + 0.3, mz, 0.3, 8, 0.3, Math.PI / 2, rand() * 3, 0, 'YXZ'));
  for (let k = -1; k <= 1; k++) addCollider(sx + Math.sin(yaw) * k * 5, sz + Math.cos(yaw) * k * 5, 3);
  addCollider(tx, tz, 2);
  exclusions.push({ x: c.x, z: c.z, r: 22 });
  return { x: tx, z: tz, spawn: { x: c.x - dx * 22, z: c.z - dz * 22 } };
}

function buildRuins(R) {
  const parent = mtx(R.x, R.h, R.z, 1, 1, 1, 0, R.ry, 0);
  const stone = () => pick(['#8f8b78', '#7d7a68', '#9a967f']);
  sb.add(G.box, stone(), mtx(0, 0.5, 0, 16, 1.4, 16), parent);
  sb.add(G.box, stone(), mtx(0, 1.9, 0, 11, 1.4, 11), parent);
  sb.add(G.box, stone(), mtx(0, 3.3, 0, 6.5, 1.4, 6.5), parent);
  for (let k = 0; k < 4; k++) sb.add(G.box, '#8a8672', mtx(0, 0.5 + k * 0.7, 8.4 - k * 1.1, 3.2, 0.7, 1.2), parent); // 階梯
  for (const [cx, cz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) sb.add(G.cyl8, '#9a967f', mtx(cx * 2.4, 5.2, cz * 2.4, 0.4, 2.4, 0.4), parent);
  sb.add(G.box, '#8a8672', mtx(0, 6.6, 0, 6, 0.5, 6), parent);
  for (let k = 0; k < 10; k++) {
    const a = (k / 10) * Math.PI * 2, broken = rand() < 0.4, h = broken ? rr(1, 2.5) : rr(4, 6.5);
    sb.add(G.cyl8, stone(), mtx(Math.cos(a) * 11, h / 2, Math.sin(a) * 11, 0.55, h, 0.55, rr(-0.12, 0.12), 0, rr(-0.12, 0.12)), parent);
  }
  sb.add(G.cyl8, '#8f8b78', mtx(7, 0.5, 9.5, 0.55, 6, 0.55, 0, 0.6, Math.PI / 2, 'YXZ'), parent);
  for (const s of [-1, 1]) sb.add(G.box, '#8a8672', mtx(s * 2.6, 2.6, 16, 1, 5.2, 1), parent);
  sb.add(G.box, '#7d7a68', mtx(0, 5.6, 16, 6.8, 0.8, 1.3), parent);
  // 石像頭
  for (const s of [-1, 1]) {
    const hp = mtx(s * 5.5, 0, 17.5, 1, 1, 1, 0, s * 0.15, 0);
    const full = parent.clone().multiply(hp);
    sb.add(G.box, '#7f7b6a', mtx(0, 1.7, 0, 1.8, 3.4, 1.4), full);
    sb.add(G.box, '#6f6b5a', mtx(0, 2.8, 0.6, 1.9, 0.35, 0.5), full);
    sb.add(G.box, '#77735f', mtx(0, 2.1, 0.8, 0.45, 1, 0.5), full);
    sb.add(G.box, '#5f5b4c', mtx(0, 1.2, 0.72, 0.9, 0.18, 0.1), full);
  }
  // 青苔
  for (let k = 0; k < 14; k++) sb.add(G.box, '#5f7a3f', mtx(rr(-7, 7), 1.22 + (k % 3) * 1.4 * (k < 6 ? 1 : 0), rr(-7, 7), rr(1, 2.5), 0.06, rr(1, 2.5)), parent);
  addCollider(R.x, R.z, 8.5);
  for (let k = 0; k < 10; k++) { const a = (k / 10) * Math.PI * 2, p = localToWorld(R.x, R.z, R.ry, Math.cos(a) * 11, Math.sin(a) * 11); addCollider(p.x, p.z, 0.8); }
  exclusions.push({ x: R.x, z: R.z, r: 20, allowSmall: true });
}

  [B.SAVANNA]: [['dryGrass', 0.25], ['acacia', 0.02], ['bush', 0.02], ['rock', 0.012]],
  [B.DESERT]: [['cactus', 0.03], ['rock', 0.015], ['dead', 0.006], ['dryGrass', 0.03]],
  [B.ROCK]: [['boulder', 0.03], ['snowPine', 0.03], ['rock', 0.03]],
  [B.SNOW]: [['boulder', 0.02], ['snowPine', 0.006]],
  [B.VOLCANIC]: [['rock', 0.04], ['dead', 0.01]],
};
const TREES = new Set(['pine', 'snowPine', 'oak', 'palm', 'jungle', 'acacia', 'cactus', 'dead']);

function tintFor(kind, b) {
  const c = new THREE.Color(1, 1, 1).multiplyScalar(rr(0.82, 1.12));
  if (kind === 'flower') c.set(pick(FLOWER_COLORS));
  if (kind === 'rock' || kind === 'boulder') {
    if (b === B.VOLCANIC) c.multiplyScalar(0.42);
    else if (b === B.SNOW) c.setRGB(1.25, 1.28, 1.3);
    else if (b === B.DESERT || b === B.SAVANNA || b === B.BEACH) c.multiply(new THREE.Color(1.15, 1.0, 0.78));
  }
  if (b === B.SAVANNA && kind === 'bush') c.multiply(new THREE.Color(1.2, 1.1, 0.6));
  return c;
}
function exclusionAt(x, z) {
  for (const e of exclusions) {
    const d = Math.hypot(x - e.x, z - e.z);
    if (d < e.r) return (e.allowSmall || d > e.r * 0.65) ? 1 : 2;
  }
  return 0;
}

let plantCount = 0;
function buildVegetation() {
  const geos = buildSpecies();
  const inst = Object.fromEntries(Object.keys(SPECIES).map((k) => [k, []]));
  const place = (kind, x, z, h, b) => {
    const sp = SPECIES[kind], s = rr(sp.s[0], sp.s[1]);
    const y = sp.fixedY !== undefined ? sp.fixedY : h - (sp.sink || 0) * s;
    const m = sp.tiltAll
      ? mtx(x, y, z, s, s * rr(0.6, 1), s, rr(0, 6.3), rr(0, 6.3), rr(0, 6.3))
      : mtx(x, y, z, s, s, s, rr(-0.06, 0.06), rr(0, 6.3), rr(-0.06, 0.06));
    inst[kind].push({ m, c: tintFor(kind, b) });
    if (sp.collide) addCollider(x, z, sp.collide * s);
    else if (sp.collideBig && s > 1.2) addCollider(x, z, sp.collideBig * s);
  };

  const SAMPLES = 170000;
  for (let k = 0; k < SAMPLES; k++) {
    const x = rr(-0.47, 0.47) * SIZE, z = rr(-0.47, 0.47) * SIZE, h = getHeight(x, z);
    if (h < 0.5) {
      // 水邊：沼澤與湖岸的蘆葦、睡蓮
      if (h > -1.6) {
        const wet = moist[cellIndex(x, z)] > 0.72 || Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 5;
        if (wet && exclusionAt(x, z) === 0) {
          if (h > -0.5 && rand() < 0.25) place('reeds', x, z, h, B.SWAMP);
          else if (h < -0.4 && rand() < 0.07) place('lily', x, z, h, B.SWAMP);
        }
      }
      continue;
    }
    const ci = cellIndex(x, z);
    if (pathMask[ci]) continue;
    const b = biomes[ci], table = SPAWN[b];
    if (!table) continue;
    let r = rand();
    for (const [kind, w] of table) {
      if (r < w) {
        const ex = exclusionAt(x, z);
        if (ex === 2 || (ex === 1 && !SMALL.has(kind))) break;
        if (TREES.has(kind) && slopes[ci] > 1.0) break;
        place(kind, x, z, h, b);
        break;
      }
      r -= w;
    }
  }
  for (const p of manualPlants) place(p.kind, p.x, p.z, getHeight(p.x, p.z), getBiome(p.x, p.z));

  for (const kind of Object.keys(inst)) {
    const list = inst[kind];
    if (!list.length) continue;
    const sp = SPECIES[kind];
    const mesh = new THREE.InstancedMesh(geos[kind], sp.sway ? swayMat : vegMat, list.length);
    list.forEach((it, i) => { mesh.setMatrixAt(i, it.m); mesh.setColorAt(i, it.c); });
    mesh.instanceMatrix.needsUpdate = true;
    mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = !!sp.shadow;
    mesh.receiveShadow = true;
    scene.add(mesh);
    plantCount += list.length;
  }
}

// 地面動物：閒置 ⇄ 漫步 ⇄ 逃跑 的簡易狀態機
class Walker {
  constructor(def, x, z, home) {
    this.def = def; this.x = x; this.z = z; this.home = home;
    this.model = def.make();
    this.heading = Math.random() * Math.PI * 2;
    this.state = 'idle'; this.timer = Math.random() * 4; this.phase = Math.random() * 10;
    this.tx = x; this.tz = z; this.move = 0; this.graze = 0; this.wantGraze = false;
    if (def.noShadow) this.model.group.traverse((o) => { o.castShadow = false; });
    scene.add(this.model.group);
  }
  canStand(x, z, loose) {
    if (getHeight(x, z) < 0.25) return false;
    if (this.home && Math.hypot(x - this.home.x, z - this.home.z) > this.def.leash) return false;
    if (isBlocked(x, z, 0.4)) return false;
    return loose || this.def.allowed.has(getBiome(x, z));
  }
  pickTarget() {
    for (let k = 0; k < 8; k++) {
      const a = Math.random() * Math.PI * 2, d = 3 + Math.random() * (this.def.wander || 20);
      const tx = this.x + Math.cos(a) * d, tz = this.z + Math.sin(a) * d;
      if (this.canStand(tx, tz)) { this.tx = tx; this.tz = tz; this.state = 'walk'; return; }
    }
    this.timer = 1 + Math.random() * 2;
  }
  update(dt, player) {
    const def = this.def;
    if (player && def.flee) {
      const dx = this.x - player.x, dz = this.z - player.z, d = Math.hypot(dx, dz);
      if (d < def.flee) {
        const k = 18 / (d || 1);
        this.tx = this.x + dx * k; this.tz = this.z + dz * k; this.state = 'run'; this.wantGraze = false;
      }
    }
    if (this.state === 'idle') {
      this.timer -= dt;
      if (this.timer <= 0) this.pickTarget();
    } else {
      const dx = this.tx - this.x, dz = this.tz - this.z, d = Math.hypot(dx, dz);
      if (d < 0.6) this.rest();
      else {
        this.heading = turnTowards(this.heading, Math.atan2(dx, dz), dt * (def.turn || 4));
        const sp = def.speed * (this.state === 'run' ? 2.4 : 1);
        const nx = this.x + Math.sin(this.heading) * sp * dt, nz = this.z + Math.cos(this.heading) * sp * dt;
        if (this.canStand(nx, nz, this.state === 'run')) { this.x = nx; this.z = nz; this.phase += dt * sp * (def.stride || 3); }
        else { this.state = 'idle'; this.timer = 0.3 + Math.random(); }
      }
    }
    const moving = this.state !== 'idle';
    this.move = lerp(this.move, moving ? 1 : 0, Math.min(1, dt * 6));
    const g = this.model.group;
    const bob = def.hop ? Math.abs(Math.sin(this.phase * 1.2)) * 0.35 * this.move : 0;
    g.position.set(this.x, getHeight(this.x, this.z) + bob, this.z);
    g.rotation.y = this.heading;
    this.model.legs.forEach((l, i) => { l.rotation.x = Math.sin(this.phase + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.7 * this.move; });
    if (this.model.neck) {
      this.graze = lerp(this.graze, !moving && this.wantGraze ? 1.1 : 0, Math.min(1, dt * 2));
      this.model.neck.rotation.x = this.graze;
    }
    if (def.kind === 'chicken' && !moving) g.rotation.x = Math.max(0, Math.sin(performance.now() * 0.006 + this.phase)) * 0.4;
    else g.rotation.x = 0;
  }
  rest() {
    this.state = 'idle';
    this.timer = (this.def.idle || [2, 7])[0] + Math.random() * ((this.def.idle || [2, 7])[1] - (this.def.idle || [2, 7])[0]);
    this.wantGraze = Math.random() < 0.6;
  }
}

// 飛鳥：繞中心盤旋，定時滑翔
class Flyer {
  constructor(model, cx, cz, radius, height, speed) {
    Object.assign(this, { model, cx, cz, radius, height, speed });
    this.a = Math.random() * Math.PI * 2; this.dir = Math.random() < 0.5 ? 1 : -1; this.ph = Math.random() * 10;
    scene.add(model.group);
  }
  update(dt, t) {
    this.a += (this.dir * this.speed / this.radius) * dt;
    const x = this.cx + Math.cos(this.a) * this.radius, z = this.cz + Math.sin(this.a) * this.radius;
    const vx = -Math.sin(this.a) * this.dir, vz = Math.cos(this.a) * this.dir;
    const g = this.model.group;
    g.position.set(x, this.height + Math.sin(t * 0.4 + this.ph) * 4, z);
    g.rotation.set(0, Math.atan2(vx, vz), -this.dir * 0.3);
    const flap = Math.sin(t * 9 + this.ph) * (0.15 + 0.6 * Math.max(0, Math.sin(t * 0.6 + this.ph)));
    for (const w of this.model.wings) w.rotation.z = w.userData.side * flap;
  }
}

// 鯊魚鰭：在外海繞圈
class Shark {
  constructor(cx, cz, r) {
    Object.assign(this, { cx, cz, r });
    this.a = Math.random() * Math.PI * 2; this.speed = 5 + Math.random() * 3;
    const g = new THREE.Group();
    const fin = new THREE.Mesh(G.cone4, amat('#4d5a66')); fin.scale.set(0.12, 1.4, 0.8); fin.position.y = 0.35; fin.rotation.x = -0.35;
    const tail = new THREE.Mesh(G.cone4, amat('#4d5a66')); tail.scale.set(0.08, 0.6, 0.35); tail.position.set(0, 0.1, -2.4);
    const shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(1, 16).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#0f2230', transparent: true, opacity: 0.45, depthWrite: false }));
    shadowMesh.scale.set(0.9, 1, 2.8); shadowMesh.position.set(0, -0.8, -0.6);
    g.add(fin, tail, shadowMesh);
    this.group = g;
    scene.add(g);
  }
  update(dt, t) {
    this.a += (this.speed / this.r) * dt;
    const x = this.cx + Math.cos(this.a) * this.r, z = this.cz + Math.sin(this.a) * this.r;
    this.group.position.set(x, Math.sin(t * 1.5 + this.a) * 0.1, z);
    this.group.rotation.y = Math.atan2(-Math.sin(this.a), Math.cos(this.a));
  }
}

// 蝴蝶：白天在花草上方隨機飛舞
class Butterfly {
  constructor(x, z) {
    this.hx = x; this.hz = z; this.x = x; this.z = z; this.a = Math.random() * 6; this.ph = Math.random() * 10;
    const g = new THREE.Group(), c = pick(['#ffd93b', '#ff8c42', '#6ec6ff', '#ffffff', '#ff6b8b']);
    const body = new THREE.Mesh(G.box, amat('#2b2b2b')); body.scale.set(0.05, 0.05, 0.25); g.add(body);
    this.wings = [-1, 1].map((s) => {
      const p = new THREE.Group(); g.add(p);
      const w = new THREE.Mesh(G.box, amat(c)); w.scale.set(0.3, 0.02, 0.26); w.position.x = s * 0.16; p.add(w);
      p.userData.side = s;
      return p;
    });
    this.group = g;
    scene.add(g);
  }
  update(dt, t, visible) {
    this.group.visible = visible;
    if (!visible) return;
    this.a += (Math.random() - 0.5) * dt * 6;
    const toHome = Math.atan2(this.hx - this.x, this.hz - this.z);
    if (Math.hypot(this.hx - this.x, this.hz - this.z) > 12) this.a = turnTowards(this.a, toHome, dt * 3);
    this.x += Math.sin(this.a) * 2 * dt; this.z += Math.cos(this.a) * 2 * dt;
    this.group.position.set(this.x, getHeight(this.x, this.z) + 1.2 + Math.sin(t * 2 + this.ph) * 0.5, this.z);
    this.group.rotation.y = this.a;
    for (const w of this.wings) w.rotation.z = w.userData.side * Math.sin(t * 22 + this.ph) * 0.9;
  }
}

function randomPointWhere(test, tries = 600, around = null, radius = 0) {
  for (let k = 0; k < tries; k++) {
    const x = around ? around.x + rr(-radius, radius) : rr(-0.45, 0.45) * SIZE;
    const z = around ? around.z + rr(-radius, radius) : rr(-0.45, 0.45) * SIZE;
    if (test(x, z)) return { x, z };
  }
  return null;
}

function spawnFauna(world) {
  const S = (arr) => new Set(arr);
  const defs = [
    { kind: 'deer', make: mkDeer, count: 12, allowed: S([B.MEADOW, B.FOREST]), speed: 3.2, flee: 24 },
    { kind: 'rabbit', make: mkRabbit, count: 16, allowed: S([B.MEADOW, B.FOREST, B.SAVANNA]), speed: 2.6, hop: true, flee: 12, idle: [1, 3], noShadow: true, wander: 10 },
    { kind: 'boar', make: mkBoar, count: 9, allowed: S([B.FOREST, B.JUNGLE, B.SWAMP]), speed: 2.8 },
    { kind: 'goat', make: mkGoat, count: 9, allowed: S([B.ROCK, B.SNOW]), speed: 2.2, flee: 16 },
    { kind: 'crab', make: mkCrab, count: 16, allowed: S([B.BEACH]), speed: 1.4, flee: 6, noShadow: true, wander: 8 },
    { kind: 'lizard', make: mkLizard, count: 8, allowed: S([B.DESERT, B.SAVANNA]), speed: 4, flee: 8, noShadow: true, idle: [1, 4], stride: 6, wander: 10 },
  ];
  const all = S([B.MEADOW, B.FOREST, B.SAVANNA, B.JUNGLE, B.DESERT, B.SWAMP, B.BEACH]);
  const byKey = Object.fromEntries(world.villages.map((v) => [v.key, v]));
  for (const v of world.villages) defs.push({ kind: 'chicken', make: mkChicken, count: 5, allowed: all, speed: 1.3, home: v, leash: 26, noShadow: true, wander: 8, idle: [1, 4], stride: 7 });
  if (byKey.meadow) defs.push({ kind: 'sheep', make: mkSheep, count: 8, allowed: all, speed: 1.2, home: byKey.meadow, leash: 70, wander: 12 });
  if (byKey.desert) defs.push({ kind: 'goat', make: mkGoat, count: 4, allowed: all, speed: 1.6, home: byKey.desert, leash: 55 });

  for (const def of defs) {
    for (let i = 0; i < def.count; i++) {
      const test = (x, z) => getHeight(x, z) > 0.4 && def.allowed.has(getBiome(x, z)) && !isBlocked(x, z, 0.5);
      const p = def.home ? randomPointWhere(test, 300, def.home, def.leash * 0.7) : randomPointWhere(test);
      if (p) walkers.push(new Walker(def, p.x, p.z, def.home || null));
    }
  }

  // 海鷗沿海岸盤旋、老鷹繞雪山、鸚鵡在雨林上空
  for (let i = 0; i < 9; i++) {
    const c = findCoast(rand() * Math.PI * 2);
    if (c) flyers.push(new Flyer(mkBird('gull'), c.x + c.dx * 20, c.z + c.dz * 20, rr(25, 60), rr(22, 40), rr(8, 12)));
  }
  for (let i = 0; i < 2; i++) flyers.push(new Flyer(mkBird('eagle'), world.peak.x, world.peak.z, rr(60, 110), world.peak.h + rr(20, 40), rr(10, 14)));
  for (let i = 0; i < 8; i++) {
    const p = randomPointWhere((x, z) => getBiome(x, z) === B.JUNGLE);
    if (p) flyers.push(new Flyer(mkBird('parrot'), p.x, p.z, rr(15, 35), getHeight(p.x, p.z) + rr(16, 24), rr(7, 10)));
  }
  for (let i = 0; i < 4; i++) {
    const c = findCoast(rand() * Math.PI * 2);
    if (c) sharks.push(new Shark(c.x + c.dx * 70, c.z + c.dz * 70, rr(25, 40)));
  }
  for (let i = 0; i < 26; i++) {
    const p = randomPointWhere((x, z) => getBiome(x, z) === B.MEADOW && !pathMask[cellIndex(x, z)]);
    if (p) butterflies.push(new Butterfly(p.x, p.z));
  }

  // 螢火蟲：夜晚才在沼澤與雨林低處亮起
  const n = 320, base = [], arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const p = randomPointWhere((x, z) => { const b = getBiome(x, z); return (b === B.SWAMP || b === B.JUNGLE) && getHeight(x, z) < 25; }, 200);
    if (!p) continue;
    base.push({ x: p.x, y: getHeight(p.x, p.z) + rr(0.6, 3), z: p.z, ph: Math.random() * 10 });
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  g.setDrawRange(0, base.length);
  fireflies = new THREE.Points(g, new THREE.PointsMaterial({ size: 1.1, color: '#e6ff7a', map: softTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  fireflies.userData.base = base;
  fireflies.frustumCulled = false;
  scene.add(fireflies);
}

function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function drawMinimap() {
  const cv = document.getElementById('minimap'), ctx = cv.getContext('2d'), W = cv.width;
  const img = ctx.createImageData(W, W), rgbs = BIOMES.map((b) => hexToRgb(b.color));
  const pathRgb = [null, [155, 123, 82], [168, 140, 98], [107, 74, 46]];
  for (let py = 0; py < W; py++) for (let px = 0; px < W; px++) {
    const x = (px / W - 0.5) * SIZE, z = (py / W - 0.5) * SIZE, h = getHeight(x, z);
    let c;
    if (h < 0) { const t = smooth(0, 22, -h); c = [lerp(80, 20, t), lerp(180, 62, t), lerp(185, 112, t)]; }
    else {
      const ci = cellIndex(x, z);
      c = pathMask[ci] ? pathRgb[pathMask[ci]] : rgbs[biomes[ci]];
      const shadeK = 1 + clamp((getHeight(x - 3, z - 3) - h) * -0.06, -0.25, 0.25);
      c = c.map((v) => v * shadeK);
    }
    const o = (py * W + px) * 4;
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  ctx.font = '10px "PingFang TC", sans-serif';
  ctx.textAlign = 'center';
  for (const p of pois) {
    const mx = (p.x / SIZE + 0.5) * W, my = (p.z / SIZE + 0.5) * W;
    ctx.fillStyle = p.cls === 'village' ? '#f2b35b' : p.cls === 'danger' ? '#ff6b4a' : '#bfe6ff';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath();
    if (p.icon === 'tri') { ctx.moveTo(mx, my - 5); ctx.lineTo(mx + 5, my + 4); ctx.lineTo(mx - 5, my + 4); ctx.closePath(); }
    else ctx.rect(mx - 3.5, my - 3.5, 7, 7);
    ctx.fill(); ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeText(p.name, mx, my - 8); ctx.lineWidth = 1;
    ctx.fillStyle = '#fff'; ctx.fillText(p.name, mx, my - 8);
  }
}
const mmo = document.getElementById('minimapOverlay').getContext('2d');
function drawMinimapOverlay() {
  const W = 220;
  mmo.clearRect(0, 0, W, W);
  const walking = mode === 'walk';
  const p = walking ? camera.position : orbit.target;
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const mx = (p.x / SIZE + 0.5) * W, my = (p.z / SIZE + 0.5) * W, ang = Math.atan2(dir.x, dir.z);
  mmo.save();
  mmo.translate(mx, my);
  mmo.rotate(-ang);
  mmo.fillStyle = walking ? '#ffffff' : 'rgba(255,255,255,0.85)';
  mmo.strokeStyle = '#111';
  mmo.beginPath(); mmo.moveTo(0, 7); mmo.lineTo(5, -5); mmo.lineTo(0, -2); mmo.lineTo(-5, -5); mmo.closePath();
  mmo.fill(); mmo.stroke();
  mmo.restore();
}

function buildLegend() {

let hour = clamp(parseFloat(params.get('hour')), 0, 23.99) || 9.5;
let timeFlow = true;
const sunDir = new THREE.Vector3();
const C = {
  white: new THREE.Color('#fff4e6'), warm: new THREE.Color('#ff9a4a'),
  fogDay: new THREE.Color('#bcd3e3'), fogDusk: new THREE.Color('#e3a77a'), fogNight: new THREE.Color('#0a1424'),
  hemiDay: new THREE.Color('#cfe4ff'), hemiNight: new THREE.Color('#34467a'),
  cloudDay: new THREE.Color('#ffffff'), cloudNight: new THREE.Color('#2a3448'), cloudDusk: new THREE.Color('#ffc9a0'),
};
const env = { day: 1, night: 0 };
function updateEnvironment(center) {
  const a = ((hour - 6) / 12) * Math.PI;
  sunDir.set(Math.cos(a), Math.sin(a), -0.35).normalize();
  const day = smooth(-0.1, 0.22, sunDir.y);
  const low = (1 - smooth(0.05, 0.45, sunDir.y)) * smooth(-0.15, 0.05, sunDir.y);
  env.day = day; env.night = 1 - day;

  skyU.sunPosition.value.copy(sunDir);
  skyU.rayleigh.value = lerp(0.4, 1.6, day);
  sunLight.position.copy(center).addScaledVector(sunDir, 700);
  sunLight.target.position.copy(center);
  sunLight.intensity = 3.2 * day;
  sunLight.color.copy(C.white).lerp(C.warm, low * 0.8);
  moonLight.position.copy(center).addScaledVector(sunDir, -700);
  moonLight.target.position.copy(center);
  moonLight.intensity = 0.9 * (1 - day);
  moon.position.copy(camera.position).addScaledVector(sunDir, -3800);
  moon.visible = sunDir.y < 0.1;
  hemi.intensity = 0.45 + 0.65 * day;
  hemi.color.copy(C.hemiNight).lerp(C.hemiDay, day);

  scene.fog.color.copy(C.fogNight).lerp(C.fogDay, day).lerp(C.fogDusk, low * 0.6);
  stars.material.opacity = clamp(1 - day * 1.3, 0, 1);
  cloudMat.color.copy(C.cloudNight).lerp(C.cloudDay, day).lerp(C.cloudDusk, low * 0.5);
  cloudMat.emissiveIntensity = 0.1 + 0.9 * day;

  const wu = water.material.uniforms;
  wu.uSunDir.value.copy(sunDir);
  wu.uSunColor.value.copy(sunLight.color).multiplyScalar(day);
  wu.uSkyColor.value.copy(scene.fog.color);
  wu.uLight.value = 0.18 + 0.82 * day;

  windowMat.emissiveIntensity = (1 - day) * 3.2;
  fireflies.material.opacity = clamp((1 - day) * 1.4 - 0.2, 0, 1);
}

let mode = 'orbit';
let spawn = { x: 0, z: 0 };
let lastWalkPos = null;
const keys = new Set();
const player = { vy: 0, onGround: false, swim: false };
const hint = document.getElementById('pauseHint');

function enterWalk() {
  mode = 'walk';
  trackIsland('island_walk_enter', { seed: SEED });
  orbit.enabled = false;
  orbit.autoRotate = false;
  const p = lastWalkPos || spawn;
  camera.position.set(p.x, getHeight(p.x, p.z) + EYE, p.z);
  if (!lastWalkPos) camera.lookAt(0, camera.position.y, 0);
  labels.forEach((l) => { l.visible = false; });
  scene.fog.near = 90; scene.fog.far = 750;
  setShadowExtent(110);
  document.getElementById('crosshair').style.display = 'block';
  document.getElementById('btnWalk').textContent = '回到環島視角（V）';
  plc.lock();
  if (!lastWalkPos) toast('你在沉船灣醒來……找到村落、補給與遮蔽處吧');
}
function exitWalk() {
  mode = 'orbit';
  if (plc.isLocked) plc.unlock();
  const p = camera.position;
  lastWalkPos = { x: p.x, z: p.z };
  orbit.target.set(p.x, getHeight(p.x, p.z), p.z);
  camera.position.set(p.x + 90, p.y + 80, p.z + 90);
  orbit.enabled = true;
  orbit.update();
  labels.forEach((l) => { l.visible = true; });
  scene.fog.near = 380; scene.fog.far = 2600;
  setShadowExtent(380);
  hint.style.display = 'none';
  document.getElementById('crosshair').style.display = 'none';
  document.getElementById('btnWalk').textContent = '步行探索（V）';
}
function toggleMode() { if (mode === 'orbit') enterWalk(); else exitWalk(); }

plc.addEventListener('lock', () => { hint.style.display = 'none'; });
plc.addEventListener('unlock', () => { if (mode === 'walk') hint.style.display = 'block'; });
renderer.domElement.addEventListener('click', () => { if (mode === 'walk' && !plc.isLocked) plc.lock(); });

function updatePlayer(dt, t) {
  if (!plc.isLocked) return;
  const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const r = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const p = camera.position;
  let sp = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 20 : 9;
  if (player.swim) sp *= 0.45;
  const len = Math.hypot(f, r) || 1;
  plc.moveForward((f / len) * sp * dt);
  plc.moveRight((r / len) * sp * dt);
  resolveCollisions(p, 0.5);
  const d = Math.hypot(p.x, p.z);
  if (d > 560) { p.x *= 560 / d; p.z *= 560 / d; }

  const g = getHeight(p.x, p.z);
  player.swim = g < -1.2;
  if (player.swim) {
    p.y = lerp(p.y, 0.55 + Math.sin(t * 2) * 0.08, Math.min(1, dt * 4));
    player.vy = 0;
  } else {
    player.vy -= 28 * dt;
    p.y += player.vy * dt;
    if (p.y <= g + EYE) { p.y = g + EYE; player.vy = 0; player.onGround = true; }
    else player.onGround = false;
    if (keys.has('Space') && player.onGround) { player.vy = 9; player.onGround = false; }
  }
}

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.code !== 'KeyV' && e.code !== 'KeyT') return;
  keys.add(e.code);
  if (e.code === 'KeyV') toggleMode();
  if (e.code === 'KeyT') toggleTime();
  if (e.code === 'Space' && mode === 'walk') e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));

function phaseName(h) { return h >= 5 && h < 7 ? '清晨' : h >= 7 && h < 17 ? '白天' : h >= 17 && h < 19 ? '黃昏' : '夜晚'; }
function updateHUD() {

  el.where.textContent = near ? `${where} · 靠近${near.name}` : where;
}

// ---------------------------------------------------------------------
async function step(text, pct) {
  document.getElementById('loadText').textContent = text;
  document.getElementById('loadBar').style.width = pct + '%';
  await new Promise((r) => setTimeout(r, 16));
}

async function main() {
  document.getElementById('seed').textContent = SEED;

  await step('隆起地形、分配生態區…', 8);
  generateHeights();
  computeBiomes();

  await step('尋找村落與地標位置…', 22);
  const world = planWorld();
  computeBiomes();
  world.villages.forEach(planVillage);
  const docks = world.villages.map(planDock).filter(Boolean);
  // 小路網：以草原村為中心連到其他村落、遺跡、碼頭與沉船營地
  const hub = world.villages.find((v) => v.key === 'meadow') || world.villages[0];
  for (const v of world.villages) if (v !== hub) stampPath(hub, v);
  if (world.ruins && hub) stampPath(hub, world.ruins);
  for (const d of docks) stampPath(d.village, d);
  if (world.wreck && world.villages.length) {
    const camp = { x: world.wreck.x - world.wreck.dx * 16, z: world.wreck.z - world.wreck.dz * 16 };
    const nearest = world.villages.reduce((a, b) => (Math.hypot(a.x - camp.x, a.z - camp.z) < Math.hypot(b.x - camp.x, b.z - camp.z) ? a : b));
    stampPath(nearest, camp);
  }
  // 雪山最高點
  let peak = { x: MOUNTAIN.x, z: MOUNTAIN.z, h: 0 };
  forCells(MOUNTAIN.x, MOUNTAIN.z, 150, (i, x, z) => { if (heights[i] > peak.h) peak = { x, z, h: heights[i] }; });
  world.peak = peak;

  await step('塑造地形網格與海洋…', 36);
  buildTerrain();
  buildWater();

  await step('搭建村落、碼頭、沉船與遺跡…', 50);
  world.villages.forEach(buildVillage);
  docks.forEach(buildDock);
  let wreckInfo = null;
  if (world.wreck) wreckInfo = buildShipwreck(world.wreck);
  if (world.ruins) buildRuins(world.ruins);
  const craterFloor = buildVolcano();
  for (const [builder, mat, cast] of [[sb, staticMat, true], [wb, windowMat, false], [fb, flameMat, false]]) {
    const m = builder.build(mat, cast);
    if (m) scene.add(m);
  }

  await step('種植森林、草地與花叢…', 66);
  buildVegetation();

  await step('放出動物…', 82);
  spawnFauna(world);
  buildClouds();

  await step('標示地標、繪製地圖…', 94);
  for (const v of world.villages) addPoi(v.name, v.x, v.h + 22, v.z, 'village', 'sq');
  if (world.ruins) addPoi('古代遺跡', world.ruins.x, world.ruins.h + 16, world.ruins.z, 'nature', 'sq');
  if (wreckInfo) addPoi('沉船灣', world.wreck.x, 16, world.wreck.z, 'danger', 'sq');
  addPoi('赤焰火山', VOLCANO.x, craterFloor + 40, VOLCANO.z, 'danger', 'tri');
  addPoi('霜頂山', peak.x, peak.h + 14, peak.z, 'nature', 'tri');
  addPoi('鏡湖', LAKE.x, 10, LAKE.z, 'nature', 'sq');
  drawMinimap();
  buildLegend();

  spawn = wreckInfo && getHeight(wreckInfo.spawn.x, wreckInfo.spawn.z) > 0.3 ? wreckInfo.spawn : (hub ? { x: hub.x + 16, z: hub.z + 16 } : { x: 0, z: 0 });
  const animalCount = walkers.length + flyers.length + sharks.length + butterflies.length;
  el.stats.textContent = `植物 ${plantCount.toLocaleString()} · 動物 ${animalCount}`;

  await step('完成！', 100);
  trackIsland('island_ready', { seed: SEED });
  const loading = document.getElementById('loading');
  loading.style.opacity = 0;
  setTimeout(() => loading.remove(), 700);

  // 網址參數 cam=x,y,z,tx,ty,tz 可指定初始鏡頭，方便分享特定視角
  const camParam = (params.get('cam') || '').split(',').map(Number);
  if (camParam.length === 6 && camParam.every(Number.isFinite)) {
    camera.position.set(camParam[0], camParam[1], camParam[2]);
    orbit.target.set(camParam[3], camParam[4], camParam[5]);
    orbit.autoRotate = false;
  }
  if (params.get('debug') !== null) console.log('[island] villages', JSON.stringify(world.villages.map((v) => ({ n: v.name, x: Math.round(v.x), z: Math.round(v.z), h: Math.round(v.h) }))), 'wreck', JSON.stringify(wreckInfo), 'ruins', JSON.stringify(world.ruins));

  const clock = new THREE.Clock();
  let elapsed = 0, hudTimer = 0;
  const center = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    timeUniform.value = elapsed;
    water.material.uniforms.uTime.value = elapsed;
    if (timeFlow) hour = (hour + dt * HOURS_PER_SEC) % 24;

    if (mode === 'walk') { updatePlayer(dt, elapsed); center.set(camera.position.x, 0, camera.position.z); }
    else { orbit.update(); center.set(orbit.target.x, 0, orbit.target.z); }
    updateEnvironment(center);

    const playerPos = mode === 'walk' ? camera.position : null;
    for (const w of walkers) w.update(dt, playerPos);
    for (const f of flyers) f.update(dt, elapsed);
    for (const s of sharks) s.update(dt, elapsed);
    for (const b of butterflies) b.update(dt, elapsed, env.day > 0.4);
    for (const c of clouds) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 1200) c.position.x = -1200;
      const m = c.userData.mat;
      m.color.copy(cloudMat.color);
      m.emissiveIntensity = cloudMat.emissiveIntensity;
      m.opacity = smooth(140, 360, c.position.distanceTo(camera.position));
      c.visible = m.opacity > 0.01;
    }
    for (const cf of campfires) {
      cf.flame.children.forEach((m, k) => { m.scale.y = (1.6 - k * 0.35) * (1 + Math.sin(elapsed * 13 + k * 2) * 0.15 + Math.random() * 0.08); });
      cf.light.intensity = (40 + 260 * env.night) * (0.85 + Math.random() * 0.3);
      cf.smoke.update(dt, env.day);
    }
    for (const b of boats) { b.position.y = 0.05 + Math.sin(elapsed * 1.2 + b.userData.ph) * 0.12; b.rotation.z = Math.sin(elapsed * 0.9 + b.userData.ph) * 0.05; }
    if (lava) {
      const k = 0.5 + 0.5 * Math.sin(elapsed * 1.7);
      lava.mesh.material.color.setRGB(1, 0.25 + k * 0.25, 0.05);
      lava.light.intensity = 2500 + k * 1500;
      lava.smoke.update(dt, env.day);
    }
    const fb2 = fireflies.userData.base, pos = fireflies.geometry.attributes.position;
    if (fireflies.material.opacity > 0) {
      for (let i = 0; i < fb2.length; i++) {
        const q = fb2[i];
        pos.setXYZ(i, q.x + Math.sin(elapsed * 0.7 + q.ph) * 1.5, q.y + Math.sin(elapsed * 1.3 + q.ph * 2) * 0.6, q.z + Math.cos(elapsed * 0.6 + q.ph) * 1.5);
      }
      pos.needsUpdate = true;
    }

    hudTimer -= dt;
    if (hudTimer <= 0) { hudTimer = 0.15; updateHUD(); drawMinimapOverlay(); }
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  });
}

main().catch((err) => {
  document.getElementById('loadText').textContent = '生成失敗：' + err.message;
  console.error(err);
});
</script>
